[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-predictor"
version = "2.2.0"
description = "Machine Learning Race Prediction & Telemetry Analysis for Formula 1"
authors = [{ name = "BLShaw" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.4.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "shap>=0.44.0",
    "streamlit>=1.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by black/formatter
]
